<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nicki Games — Пазлы</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #f0f4f8;
    font-family: system-ui, -apple-system, sans-serif;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  /* Экраны */
  .screen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease;
    background: #f0f4f8;
    z-index: 1;
  }
  .screen.active {
    opacity: 1; pointer-events: auto; z-index: 10;
  }

  /* Титульный экран */
  #titleScreen {
    background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
  }
  .title-text {
    font-size: 48px; font-weight: 800; color: #fff;
    text-shadow: 0 4px 12px rgba(0,0,0,.2);
    display: flex; gap: 4px; margin-bottom: 20px;
  }
  .title-text span {
    display: inline-block;
    animation: bounce 2s infinite ease-in-out;
  }
  .title-text span:nth-child(2n) { animation-delay: 0.2s; }
  .title-text span:nth-child(3n) { animation-delay: 0.4s; }
  .title-text span:nth-child(4n) { animation-delay: 0.6s; }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
  }
  .subtitle {
    font-size: 22px; color: #fff; margin-bottom: 40px;
    font-weight: 600; text-shadow: 0 2px 8px rgba(0,0,0,.15);
  }
  
  /* Кнопки */
  button {
    font-size: 20px; font-weight: 700;
    padding: 16px 40px; border: none; border-radius: 20px;
    color: #fff; cursor: pointer;
    box-shadow: 0 4px 12px rgba(0,0,0,.2);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  button:active { transform: scale(0.95); box-shadow: 0 2px 6px rgba(0,0,0,.2); }
  .btn-play {
    background: #ff6b6b; font-size: 26px; padding: 18px 60px;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  .btn-back {
    background: #95a5a6; padding: 10px 20px; font-size: 16px;
    position: absolute; top: 16px; left: 16px; z-index: 100;
  }
  .btn-upload {
    background: #27ae60; margin-top: 20px;
  }

  /* Экран выбора */
  #selectScreen {
    background: #f0f4f8;
    padding: 20px;
    justify-content: flex-start;
    padding-top: 60px;
  }
  .select-title {
    font-size: 24px; font-weight: 700; color: #333;
    margin-bottom: 20px; text-align: center;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px; width: 100%; max-width: 500px;
  }
  .card {
    background: #fff; border-radius: 16px; overflow: hidden;
    box-shadow: 0 4px 12px rgba(0,0,0,.1);
    cursor: pointer; transition: transform 0.1s;
    display: flex; flex-direction: column; align-items: center;
  }
  .card:active { transform: scale(0.96); }
  .card canvas { width: 100%; height: auto; display: block; }
  .card span {
    padding: 10px; font-size: 16px; font-weight: 600; color: #444;
  }

  /* Игровой экран */
  #gameScreen {
    display: flex; flex-direction: column; align-items: center;
    padding: 8px; gap: 8px; justify-content: flex-start;
  }
  #boardWrap { position: relative; flex-shrink: 0; margin-top: 40px; }
  #board { display: block; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.15); background: #fff; }
  #tray {
    position: relative; width: 100%;
    display: flex; flex-wrap: wrap; justify-content: center;
    align-content: flex-start; gap: 4px; padding: 4px;
  }
  .piece {
    position: absolute; border-radius: 4px; background-repeat: no-repeat;
    box-shadow: 0 2px 6px rgba(0,0,0,.2);
    touch-action: none; will-change: transform, left, top;
    transition: transform 0.18s ease;
  }
  .piece.placed { box-shadow: none; border-radius: 0; transition: none; }
  .piece.shake { animation: shake .4s ease; }
  @keyframes shake {
    0%,100% { transform: translateX(0) rotate(0); }
    20% { transform: translateX(-8px) rotate(-3deg); }
    40% { transform: translateX(8px) rotate(3deg); }
    60% { transform: translateX(-6px) rotate(-2deg); }
    80% { transform: translateX(6px) rotate(2deg); }
  }
  #buttons { display: flex; gap: 12px; padding: 4px 0; }
  #btnLines { background: #4a90d9; }
  #btnShuffle { background: #e67e22; }
  #btnRestartWin { background: #27ae60; font-size: 22px; padding: 16px 40px; }

  #highlight {
    position: fixed; pointer-events: none; border-radius: 4px;
    background: rgba(74,144,217,.25); border: 2px solid rgba(74,144,217,.8);
    z-index: 999; display: none; box-sizing: border-box;
  }

  /* Окно победы */
  #win {
    position: fixed; inset: 0; background: rgba(0,0,0,.6);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 24px; z-index: 1000; padding: 20px;
  }
  #win.show { display: flex; }
  #winCanvas { border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,.5); }
  #winTitle { color: #fff; font-size: 32px; font-weight: 800; text-shadow: 0 2px 8px rgba(0,0,0,.5); }
  
  /* Подтверждение */
  #confirm {
    position: fixed; inset: 0; background: rgba(0,0,0,.5);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    z-index: 1000; padding: 20px;
  }
  #confirm.show { display: flex; }
  #confirmBox {
    background: #fff; padding: 24px; border-radius: 20px; text-align: center;
    max-width: 300px; width: 100%;
  }
  #confirmBox p { font-size: 18px; margin: 0 0 20px 0; color: #333; }
  .confirm-btns { display: flex; gap: 12px; justify-content: center; }
  .confirm-btns button { font-size: 16px; padding: 12px 20px; }
  .btn-yes { background: #e74c3c; }
  .btn-no { background: #bdc3c7; color: #333; }

  /* Загрузка */
  #loading {
    position: fixed; inset: 0; background: rgba(0,0,0,.7);
    display: none; align-items: center; justify-content: center;
    color: #fff; font-size: 20px; z-index: 2000;
  }
  #loading.show { display: flex; }
</style>
</head>
<body>

<!-- ЭКРАН 1: ТИТУЛЬНЫЙ -->
<div id="titleScreen" class="screen active">
  <div class="title-text">
    <span>N</span><span>I</span><span>C</span><span>K</span><span>I</span>
  </div>
  <div class="subtitle">Весёлые Пазлы</div>
  <button class="btn-play" onclick="goToSelect()">ИГРАТЬ</button>
</div>

<!-- ЭКРАН 2: ВЫБОР КАРТИНКИ -->
<div id="selectScreen" class="screen">
  <button class="btn-back" onclick="goToTitle()">← Назад</button>
  <div class="select-title">Выбери картинку:</div>
  <div class="grid" id="galleryGrid">
    <!-- Карточки добавляются через JS -->
  </div>
  <button class="btn-upload" onclick="document.getElementById('fileInput').click()">📷 Своё фото</button>
  <input type="file" id="fileInput" accept="image/*" style="display: none;">
</div>

<!-- ЭКРАН 3: ИГРА -->
<div id="gameScreen" class="screen">
  <button class="btn-back" onclick="askBack()">← Назад</button>
  <div id="boardWrap"><canvas id="board"></canvas></div>
  <div id="buttons">
    <button id="btnLines">Показать линии</button>
    <button id="btnShuffle" disabled>Перемешать</button>
  </div>
  <div id="tray"></div>
</div>

<!-- Служебные слои -->
<div id="highlight"></div>
<div id="loading">Загрузка фото...</div>

<!-- ОКНО ПОБЕДЫ -->
<div id="win">
  <div id="winTitle">Победа! 🎉</div>
  <canvas id="winCanvas"></canvas>
  <button id="btnRestartWin">Играть ещё</button>
</div>

<!-- ОКНО ПОДТВЕРЖДЕНИЯ -->
<div id="confirm">
  <div id="confirmBox">
    <p>Точно хочешь выйти?<br>Пазл не собран.</p>
    <div class="confirm-btns">
      <button class="btn-yes" onclick="confirmBack()">Да</button>
      <button class="btn-no" onclick="cancelBack()">Нет</button>
    </div>
  </div>
</div>

<script>
(function() {
  // --- КОНСТАНТЫ ---
  const SIZE = 3;
  const TRAY_SCALE = 0.65;
  const BOARD_SCALE = 1.0;
  const HINT_ALPHA = 0.15;
  const SCALE_DURATION = 180;
  const SNAP_TOLERANCE = 0.6;

  // --- ПЕРЕМЕННЫЕ ---
  let boardSize = 0, cellSize = 0;
  let linesShown = false, shuffled = false;
  let pieces = [];
  let boardImg = null;
  let placedCount = 0;
  let dragging = null;
  let dragOffset = { x: 0, y: 0 };
  let startX = 0, startY = 0;
  let dragStarted = false;
  let currentScale = TRAY_SCALE;
  let overBoard = false, highlightActive = false;

  // --- DOM ЭЛЕМЕНТЫ ---
  const titleScreen = document.getElementById('titleScreen');
  const selectScreen = document.getElementById('selectScreen');
  const gameScreen = document.getElementById('gameScreen');
  const galleryGrid = document.getElementById('galleryGrid');
  const boardWrap = document.getElementById('boardWrap');
  const board = document.getElementById('board');
  const tray = document.getElementById('tray');
  const btnLines = document.getElementById('btnLines');
  const btnShuffle = document.getElementById('btnShuffle');
  const btnRestartWin = document.getElementById('btnRestartWin');
  const winOverlay = document.getElementById('win');
  const winCanvas = document.getElementById('winCanvas');
  const highlightEl = document.getElementById('highlight');
  const confirmOverlay = document.getElementById('confirm');
  const loadingOverlay = document.getElementById('loading');
  const fileInput = document.getElementById('fileInput');

  // --- ГЕНЕРАТОРЫ КАРТИНОК ---
  function drawCat(size) {
    const c = document.createElement('canvas'); c.width = size; c.height = size; const ctx = c.getContext('2d');
    const g = ctx.createLinearGradient(0, 0, size, size); g.addColorStop(0, '#ffe9b8'); g.addColorStop(1, '#ffd4e5'); ctx.fillStyle = g; ctx.fillRect(0, 0, size, size);
    const cx = size / 2, cy = size / 2, R = size * 0.32;
    ctx.fillStyle = '#f4a460';
    ctx.beginPath(); ctx.moveTo(cx - R * 0.75, cy - R * 0.55); ctx.lineTo(cx - R * 0.95, cy - R * 1.35); ctx.lineTo(cx - R * 0.2, cy - R * 0.95); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx + R * 0.75, cy - R * 0.55); ctx.lineTo(cx + R * 0.95, cy - R * 1.35); ctx.lineTo(cx + R * 0.2, cy - R * 0.95); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffb6c1';
    ctx.beginPath(); ctx.moveTo(cx - R * 0.7, cy - R * 0.6); ctx.lineTo(cx - R * 0.82, cy - R * 1.15); ctx.lineTo(cx - R * 0.3, cy - R * 0.85); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx + R * 0.7, cy - R * 0.6); ctx.lineTo(cx + R * 0.82, cy - R * 1.15); ctx.lineTo(cx + R * 0.3, cy - R * 0.85); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#f4a460'; ctx.beginPath(); ctx.ellipse(cx, cy, R, R * 0.9, 0, 0, Math.PI * 2); ctx.fill();
    const eyeY = cy - R * 0.1, eyeDX = R * 0.45; ctx.fillStyle = '#2d2d2d';
    ctx.beginPath(); ctx.ellipse(cx - eyeDX, eyeY, R * 0.16, R * 0.22, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + eyeDX, eyeY, R * 0.16, R * 0.22, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(cx - eyeDX + R * 0.05, eyeY - R * 0.08, R * 0.06, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + eyeDX + R * 0.05, eyeY - R * 0.08, R * 0.06, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e75480'; ctx.beginPath(); ctx.moveTo(cx - R * 0.08, cy + R * 0.22); ctx.lineTo(cx + R * 0.08, cy + R * 0.22); ctx.lineTo(cx, cy + R * 0.32); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#2d2d2d'; ctx.lineWidth = R * 0.05; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cx, cy + R * 0.32); ctx.lineTo(cx - R * 0.15, cy + R * 0.45); ctx.moveTo(cx, cy + R * 0.32); ctx.lineTo(cx + R * 0.15, cy + R * 0.45); ctx.stroke();
    ctx.lineWidth = R * 0.03;
    for (let side = -1; side <= 1; side += 2) { for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(cx + side * R * 0.25, cy + R * 0.35 + i * R * 0.1); ctx.lineTo(cx + side * R * 0.85, cy + R * 0.25 + i * R * 0.18); ctx.stroke(); } }
    ctx.fillStyle = 'rgba(255,150,180,.5)';
    ctx.beginPath(); ctx.ellipse(cx - R * 0.55, cy + R * 0.25, R * 0.15, R * 0.1, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + R * 0.55, cy + R * 0.25, R * 0.15, R * 0.1, 0, 0, Math.PI * 2); ctx.fill();
    return c;
  }

  function drawHouse(size) {
    const c = document.createElement('canvas'); c.width = size; c.height = size; const ctx = c.getContext('2d');
    const g = ctx.createLinearGradient(0, 0, 0, size); g.addColorStop(0, '#87CEEB'); g.addColorStop(1, '#98FB98'); ctx.fillStyle = g; ctx.fillRect(0, 0, size, size);
    ctx.fillStyle = '#FFD700'; ctx.beginPath(); ctx.arc(size * 0.8, size * 0.2, size * 0.1, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#8B4513'; ctx.fillRect(size * 0.3, size * 0.45, size * 0.4, size * 0.35);
    ctx.fillStyle = '#FF6347'; ctx.beginPath(); ctx.moveTo(size * 0.2, size * 0.45); ctx.lineTo(size * 0.5, size * 0.2); ctx.lineTo(size * 0.8, size * 0.45); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#A0522D'; ctx.fillRect(size * 0.45, size * 0.6, size * 0.1, size * 0.2);
    ctx.fillStyle = '#87CEEB'; ctx.fillRect(size * 0.35, size * 0.55, size * 0.1, size * 0.1); ctx.fillRect(size * 0.55, size * 0.55, size * 0.1, size * 0.1);
    ctx.fillStyle = '#228B22'; ctx.beginPath(); ctx.arc(size * 0.15, size * 0.8, size * 0.1, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#8B4513'; ctx.fillRect(size * 0.13, size * 0.8, size * 0.04, size * 0.15);
    return c;
  }

  function drawDog(size) {
    const c = document.createElement('canvas'); c.width = size; c.height = size; const ctx = c.getContext('2d');
    const g = ctx.createLinearGradient(0, 0, size, size); g.addColorStop(0, '#e0f7fa'); g.addColorStop(1, '#b2ebf2'); ctx.fillStyle = g; ctx.fillRect(0, 0, size, size);
    const cx = size / 2, cy = size / 2, R = size * 0.3;
    ctx.fillStyle = '#d2b48c'; ctx.beginPath(); ctx.ellipse(cx, cy, R, R * 1.1, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#8b4513'; ctx.beginPath(); ctx.ellipse(cx - R * 0.8, cy - R * 0.2, R * 0.3, R * 0.6, -0.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + R * 0.8, cy - R * 0.2, R * 0.3, R * 0.6, 0.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(cx, cy + R * 0.5, R * 0.5, R * 0.3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2d2d2d'; ctx.beginPath(); ctx.arc(cx, cy + R * 0.4, R * 0.15, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx - R * 0.4, cy - R * 0.2, R * 0.1, R * 0.15, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + R * 0.4, cy - R * 0.2, R * 0.1, R * 0.15, 0, 0, Math.PI * 2); ctx.fill();
    return c;
  }

  function drawCow(size) {
    const c = document.createElement('canvas'); c.width = size; c.height = size; const ctx = c.getContext('2d');
    const g = ctx.createLinearGradient(0, 0, size, size); g.addColorStop(0, '#ffe0b2'); g.addColorStop(1, '#ffcc80'); ctx.fillStyle = g; ctx.fillRect(0, 0, size, size);
    const cx = size / 2, cy = size / 2, R = size * 0.32;
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(cx, cy, R, R * 0.9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#333'; ctx.beginPath(); ctx.ellipse(cx - R * 0.5, cy - R * 0.4, R * 0.3, R * 0.2, 0.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + R * 0.6, cy + R * 0.2, R * 0.25, R * 0.3, -0.3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f5deb3'; ctx.beginPath(); ctx.ellipse(cx, cy + R * 0.3, R * 0.5, R * 0.4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e75480'; ctx.beginPath(); ctx.ellipse(cx - R * 0.1, cy + R * 0.4, R * 0.08, R * 0.1, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + R * 0.1, cy + R * 0.4, R * 0.08, R * 0.1, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2d2d2d'; ctx.beginPath(); ctx.arc(cx, cy - R * 0.1, R * 0.1, 0, Math.PI * 2); ctx.fill();
    return c;
  }

  function drawCar(size) {
    const c = document.createElement('canvas'); c.width = size; c.height = size; const ctx = c.getContext('2d');
    const g = ctx.createLinearGradient(0, 0, 0, size); g.addColorStop(0, '#b3e5fc'); g.addColorStop(1, '#cfd8dc'); ctx.fillStyle = g; ctx.fillRect(0, 0, size, size);
    ctx.fillStyle = '#555'; ctx.fillRect(0, size * 0.7, size, size * 0.1);
    ctx.fillStyle = '#ff5722'; ctx.beginPath(); ctx.roundRect(size * 0.1, size * 0.5, size * 0.8, size * 0.2, size * 0.05); ctx.fill();
    ctx.fillStyle = '#ff5722'; ctx.beginPath(); ctx.roundRect(size * 0.25, size * 0.3, size * 0.5, size * 0.2, size * 0.05); ctx.fill();
    ctx.fillStyle = '#bbdefb'; ctx.fillRect(size * 0.3, size * 0.35, size * 0.15, size * 0.15); ctx.fillRect(size * 0.55, size * 0.35, size * 0.15, size * 0.15);
    ctx.fillStyle = '#333'; ctx.beginPath(); ctx.arc(size * 0.25, size * 0.7, size * 0.1, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(size * 0.75, size * 0.7, size * 0.1, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ccc'; ctx.beginPath(); ctx.arc(size * 0.25, size * 0.7, size * 0.05, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(size * 0.75, size * 0.7, size * 0.05, 0, Math.PI * 2); ctx.fill();
    return c;
  }

  function drawPlane(size) {
    const c = document.createElement('canvas'); c.width = size; c.height = size; const ctx = c.getContext('2d');
    const g = ctx.createLinearGradient(0, 0, 0, size); g.addColorStop(0, '#87CEEB'); g.addColorStop(1, '#fff'); ctx.fillStyle = g; ctx.fillRect(0, 0, size, size);
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(size * 0.8, size * 0.2, size * 0.08, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(size * 0.7, size * 0.15, size * 0.06, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f44336'; ctx.beginPath(); ctx.ellipse(size * 0.5, size * 0.55, size * 0.3, size * 0.1, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#d32f2f'; ctx.beginPath(); ctx.moveTo(size * 0.5, size * 0.45); ctx.lineTo(size * 0.8, size * 0.55); ctx.lineTo(size * 0.5, size * 0.55); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(size * 0.4, size * 0.55); ctx.lineTo(size * 0.3, size * 0.35); ctx.lineTo(size * 0.5, size * 0.55); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#90a4ae'; ctx.beginPath(); ctx.ellipse(size * 0.4, size * 0.55, size * 0.1, size * 0.04, 0, 0, Math.PI * 2); ctx.fill();
    return c;
  }

  const galleryData = [
    { name: 'Котёнок', draw: drawCat },
    { name: 'Домик', draw: drawHouse },
    { name: 'Щенок', draw: drawDog },
    { name: 'Коровка', draw: drawCow },
    { name: 'Машинка', draw: drawCar },
    { name: 'Самолётик', draw: drawPlane }
  ];

  // --- НАВИГАЦИЯ ---
  function switchScreen(from, to) {
    from.classList.remove('active');
    setTimeout(() => {
      from.style.display = 'none';
      to.style.display = 'flex';
      setTimeout(() => to.classList.add('active'), 50);
    }, 300); // ждем окончания анимации прозрачности
  }

  window.goToTitle = function() {
    switchScreen(selectScreen, titleScreen);
  };

  window.goToSelect = function() {
    switchScreen(titleScreen, selectScreen);
  };

  // --- РЕНДЕР ГАЛЕРЕИ ---
  function renderGallery() {
    galleryGrid.innerHTML = '';
    galleryData.forEach(item => {
      const div = document.createElement('div');
      div.className = 'card';
      
      const canvas = document.createElement('canvas');
      canvas.width = 200; canvas.height = 200;
      const imgCanvas = item.draw(200);
      canvas.getContext('2d').drawImage(imgCanvas, 0, 0);
      
      const span = document.createElement('span');
      span.textContent = item.name;
      
      div.appendChild(canvas);
      div.appendChild(span);
      
      div.onclick = () => startGame(item.draw);
      galleryGrid.appendChild(div);
    });
  }

  fileInput.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    loadingOverlay.classList.add('show');

    const reader = new FileReader();
    reader.onload = function(event) {
      const img = new Image();
      img.onload = function() {
        // Создаем квадратный холст
        const size = Math.min(img.width, img.height);
        const canvas = document.createElement('canvas');
        canvas.width = 800; // Оптимальный размер для игры
        canvas.height = 800;
        const ctx = canvas.getContext('2d');

        // Обрезаем по центру
        const sx = (img.width - size) / 2;
        const sy = (img.height - size) / 2;
        
        ctx.drawImage(img, sx, sy, size, size, 0, 0, 800, 800);

        // Передаем в игру функцию, которая просто возвращает этот холст
        const customImageFunc = () => canvas;
        startGame(customImageFunc);
        
        loadingOverlay.classList.remove('show');
        fileInput.value = ''; // Сбрасываем, чтобы можно было загрузить ту же картинку еще раз
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
  });
