<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Пазл — Котёнок</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #f0f4f8;
    font-family: system-ui, -apple-system, sans-serif;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #app {
    display: flex; flex-direction: column;
    align-items: center;
    height: 100%;
    padding: 8px;
    gap: 8px;
  }
  #boardWrap { position: relative; flex-shrink: 0; }
  #board {
    display: block;
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,.15);
    background: #fff;
  }
  #tray {
    position: relative;
    width: 100%;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-content: flex-start;
    gap: 4px;
    padding: 4px;
  }
  .piece {
    position: absolute;
    border-radius: 4px;
    background-repeat: no-repeat;
    box-shadow: 0 2px 6px rgba(0,0,0,.2);
    touch-action: none;
    will-change: transform, left, top;
    transition: transform 0.18s ease;
  }
  .piece.placed {
    box-shadow: none;
    border-radius: 0;
    transition: none;
  }
  .piece.shake {
    animation: shake .4s ease;
  }
  @keyframes shake {
    0%,100% { transform: translateX(0) rotate(0); }
    20% { transform: translateX(-8px) rotate(-3deg); }
    40% { transform: translateX(8px) rotate(3deg); }
    60% { transform: translateX(-6px) rotate(-2deg); }
    80% { transform: translateX(6px) rotate(2deg); }
  }
  #buttons { display: flex; gap: 12px; padding: 4px 0; }
  button {
    font-size: 18px; font-weight: 600;
    padding: 14px 24px; border: none; border-radius: 14px;
    color: #fff; cursor: pointer;
    box-shadow: 0 3px 8px rgba(0,0,0,.2);
  }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .4; }
  #btnLines { background: #4a90d9; }
  #btnShuffle { background: #e67e22; }
  #btnRestart { background: #27ae60; }

  #win {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.6);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px; z-index: 100; padding: 20px;
  }
  #win.show { display: flex; }
  #winCanvas { border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,.5); }
  #winTitle { color: #fff; font-size: 32px; font-weight: 800; text-shadow: 0 2px 8px rgba(0,0,0,.5); }
  #win button { font-size: 22px; padding: 16px 40px; }

  #highlight {
    position: fixed;
    pointer-events: none;
    border-radius: 4px;
    background: rgba(74,144,217,.25);
    border: 2px solid rgba(74,144,217,.8);
    z-index: 999;
    display: none;
    box-sizing: border-box;
  }
</style>
</head>
<body>
<div id="app">
  <div id="boardWrap"><canvas id="board"></canvas></div>
  <div id="buttons">
    <button id="btnLines">Показать линии</button>
    <button id="btnShuffle" disabled>Перемешать</button>
  </div>
  <div id="tray"></div>
</div>

<div id="highlight"></div>

<div id="win">
  <div id="winTitle">Победа! 🎉</div>
  <canvas id="winCanvas"></canvas>
  <button id="btnRestart">Начать заново</button>
</div>

<script>
(function() {
  const SIZE = 3;
  const TRAY_SCALE = 0.65;
  const BOARD_SCALE = 1.0;
  const HINT_ALPHA = 0.15;
  const SCALE_DURATION = 180;
  const SNAP_TOLERANCE = 0.6;

  const boardWrap = document.getElementById('boardWrap');
  const board = document.getElementById('board');
  const tray = document.getElementById('tray');
  const btnLines = document.getElementById('btnLines');
  const btnShuffle = document.getElementById('btnShuffle');
  const btnRestart = document.getElementById('btnRestart');
  const winOverlay = document.getElementById('win');
  const winCanvas = document.getElementById('winCanvas');
  const highlightEl = document.getElementById('highlight');

  let boardSize = 0;
  let cellSize = 0;
  let linesShown = false;
  let shuffled = false;
  let pieces = [];
  let boardImg = null;
  let placedCount = 0;
  let dragging = null;
  let dragOffset = { x: 0, y: 0 };
  let startX = 0, startY = 0;
  let dragStarted = false;
  let currentScale = TRAY_SCALE;
  let overBoard = false;
  let highlightActive = false;

  function makeCatImage(size) {
    const c = document.createElement('canvas');
    c.width = size; c.height = size;
    const ctx = c.getContext('2d');
    const g = ctx.createLinearGradient(0, 0, size, size);
    g.addColorStop(0, '#ffe9b8');
    g.addColorStop(1, '#ffd4e5');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, size, size);

    const cx = size / 2, cy = size / 2, R = size * 0.32;

    ctx.fillStyle = '#f4a460';
    ctx.beginPath();
    ctx.moveTo(cx - R * 0.75, cy - R * 0.55);
    ctx.lineTo(cx - R * 0.95, cy - R * 1.35);
    ctx.lineTo(cx - R * 0.2, cy - R * 0.95);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx + R * 0.75, cy - R * 0.55);
    ctx.lineTo(cx + R * 0.95, cy - R * 1.35);
    ctx.lineTo(cx + R * 0.2, cy - R * 0.95);
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = '#ffb6c1';
    ctx.beginPath();
    ctx.moveTo(cx - R * 0.7, cy - R * 0.6);
    ctx.lineTo(cx - R * 0.82, cy - R * 1.15);
    ctx.lineTo(cx - R * 0.3, cy - R * 0.85);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx + R * 0.7, cy - R * 0.6);
    ctx.lineTo(cx + R * 0.82, cy - R * 1.15);
    ctx.lineTo(cx + R * 0.3, cy - R * 0.85);
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = '#f4a460';
    ctx.beginPath();
    ctx.ellipse(cx, cy, R, R * 0.9, 0, 0, Math.PI * 2);
    ctx.fill();

    const eyeY = cy - R * 0.1, eyeDX = R * 0.45;
    ctx.fillStyle = '#2d2d2d';
    ctx.beginPath();
    ctx.ellipse(cx - eyeDX, eyeY, R * 0.16, R * 0.22, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx + eyeDX, eyeY, R * 0.16, R * 0.22, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(cx - eyeDX + R * 0.05, eyeY - R * 0.08, R * 0.06, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx + eyeDX + R * 0.05, eyeY - R * 0.08, R * 0.06, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#e75480';
    ctx.beginPath();
    ctx.moveTo(cx - R * 0.08, cy + R * 0.22);
    ctx.lineTo(cx + R * 0.08, cy + R * 0.22);
    ctx.lineTo(cx, cy + R * 0.32);
    ctx.closePath(); ctx.fill();

    ctx.strokeStyle = '#2d2d2d';
    ctx.lineWidth = R * 0.05;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx, cy + R * 0.32);
    ctx.lineTo(cx - R * 0.15, cy + R * 0.45);
    ctx.moveTo(cx, cy + R * 0.32);
    ctx.lineTo(cx + R * 0.15, cy + R * 0.45);
    ctx.stroke();

    ctx.lineWidth = R * 0.03;
    for (let side = -1; side <= 1; side += 2) {
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.moveTo(cx + side * R * 0.25, cy + R * 0.35 + i * R * 0.1);
        ctx.lineTo(cx + side * R * 0.85, cy + R * 0.25 + i * R * 0.18);
        ctx.stroke();
      }
    }

    ctx.fillStyle = 'rgba(255,150,180,.5)';
    ctx.beginPath();
    ctx.ellipse(cx - R * 0.55, cy + R * 0.25, R * 0.15, R * 0.1, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx + R * 0.55, cy + R * 0.25, R * 0.15, R * 0.1, 0, 0, Math.PI * 2);
    ctx.fill();

    return c;
  }

  function calcBoardSize() {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    let s = Math.min(vw * 0.9, vh * 0.5);
    return Math.floor(s);
  }

  function drawBoard() {
    const ctx = board.getContext('2d');
    const bs = boardSize;
    board.width = bs;
    board.height = bs;
    board.style.width = bs + 'px';
    board.style.height = bs + 'px';

    if (shuffled && placedCount < SIZE * SIZE) {
      ctx.globalAlpha = HINT_ALPHA;
      ctx.drawImage(boardImg, 0, 0, bs, bs);
      ctx.globalAlpha = 1;
    } else {
      ctx.globalAlpha = 1;
      ctx.drawImage(boardImg, 0, 0, bs, bs);
    }

    if (linesShown) {
      ctx.strokeStyle = 'rgba(0,0,0,.55)';
      ctx.lineWidth = 2;
      for (let i = 1; i < SIZE; i++) {
        const p = (bs / SIZE) * i;
        ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, bs); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, p); ctx.lineTo(bs, p); ctx.stroke();
      }
    }
  }

  function createPieces() {
    pieces.forEach(p => p.el.remove());
    pieces = [];
    placedCount = 0;

    const cs = cellSize;
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const el = document.createElement('div');
        el.className = 'piece';
        el.style.width = cs + 'px';
        el.style.height = cs + 'px';
        el.style.backgroundImage = 'url(' + boardImg.toDataURL() + ')';
        el.style.backgroundSize = (cs * SIZE) + 'px ' + (cs * SIZE) + 'px';
        el.style.backgroundPosition = (-c * cs) + 'px ' + (-r * cs) + 'px';
        el.style.display = 'none';
        el.dataset.row = r;
        el.dataset.col = c;
        el.dataset.placed = '0';
        el.dataset.scale = TRAY_SCALE;
        tray.appendChild(el);
        pieces.push({ el, row: r, col: c, placed: false });
        attachEvents(el);
      }
    }
  }

  function layoutTray(order) {
    const cs = cellSize;
    const scaled = cs * TRAY_SCALE;
    const gap = 6;
    const totalW = tray.clientWidth || (boardSize + 16);
    const perRow = Math.max(1, Math.floor((totalW - gap) / (scaled + gap)));
    const ord = order || pieces.slice();

    ord.forEach((p, idx) => {
      p.el.style.display = '';
      const row = Math.floor(idx / perRow);
      const col = idx % perRow;
      const x = gap + col * (scaled + gap);
      const y = gap + row * (scaled + gap);
      const el = p.el;
      el.style.position = 'absolute';
      el.style.left = '0px';
      el.style.top = '0px';
      el.style.transition = 'transform ' + SCALE_DURATION + 'ms ease';
      el.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + TRAY_SCALE + ')';
      el.dataset.trayX = x;
      el.dataset.trayY = y;
      el.dataset.scale = TRAY_SCALE;
    });

    const rows = Math.ceil(ord.length / perRow);
    tray.style.height = (rows * (scaled + gap) + gap) + 'px';
  }

  function shuffleArray(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    let same = true;
    for (let i = 0; i < a.length; i++) {
      if (a[i].row !== Math.floor(i / SIZE) || a[i].col !== i % SIZE) { same = false; break; }
    }
    if (same) return shuffleArray(arr);
    return a;
  }

  function attachEvents(el) {
    el.addEventListener('pointerdown', onDown);
    el.addEventListener('pointermove', onMove);
    el.addEventListener('pointerup', onUp);
    el.addEventListener('pointercancel', onUp);
  }

  function onDown(e) {
    const el = e.currentTarget;
    if (el.dataset.placed === '1') return;
    if (!shuffled) return;
    e.preventDefault();
    const piece = pieces.find(p => p.el === el);
    if (!piece) return;

    dragging = piece;
    dragStarted = false;
    currentScale = parseFloat(el.dataset.scale) || TRAY_SCALE;
    overBoard = false;

    const rect = el.getBoundingClientRect();
    dragOffset.x = (e.clientX - rect.left) / currentScale;
    dragOffset.y = (e.clientY - rect.top) / currentScale;

    startX = e.clientX; startY = e.clientY;
    el.style.zIndex = 1000;
    el.style.transition = 'none';

    const left = e.clientX - dragOffset.x * currentScale;
    const top = e.clientY - dragOffset.y * currentScale;
    el.style.position = 'fixed';
    el.style.left = '0px';
    el.style.top = '0px';
    el.style.transform = 'translate(' + left + 'px,' + top + 'px) scale(' + currentScale + ')';

    el.setPointerCapture(e.pointerId);
  }

  function onMove(e) {
    if (!dragging) return;
    e.preventDefault();
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if (!dragStarted && Math.abs(dx) + Math.abs(dy) > 6) dragStarted = true;
    if (!dragStarted) return;

    const boardRect = board.getBoundingClientRect();
    const isOver = e.clientX >= boardRect.left && e.clientX <= boardRect.right &&
                   e.clientY >= boardRect.top && e.clientY <= boardRect.bottom;

    if (isOver !== overBoard) {
      overBoard = isOver;
      currentScale = overBoard ? BOARD_SCALE : TRAY_SCALE;
      dragging.el.style.transition = 'transform ' + SCALE_DURATION + 'ms ease';
      dragging.el.dataset.scale = currentScale;
    }

    const left = e.clientX - dragOffset.x * currentScale;
    const top = e.clientY - dragOffset.y * currentScale;
    dragging.el.style.transform = 'translate(' + left + 'px,' + top + 'px) scale(' + currentScale + ')';

    updateHighlight(e.clientX, e.clientY);
  }

  function updateHighlight(cx, cy) {
    if (!dragging) { hideHighlight(); return; }
    const boardRect = board.getBoundingClientRect();
    const piece = dragging;

    const targetX = boardRect.left + piece.col * cellSize;
    const targetY = boardRect.top + piece.row * cellSize;

    const left = cx - dragOffset.x * currentScale;
    const top = cy - dragOffset.y * currentScale;

    const tol = cellSize * SNAP_TOLERANCE;
    const within = Math.abs(left - targetX) < tol && Math.abs(top - targetY) < tol;

    if (within && overBoard) {
      if (!highlightActive) {
        highlightEl.style.display = 'block';
        highlightEl.style.left = targetX + 'px';
        highlightEl.style.top = targetY + 'px';
        highlightEl.style.width = cellSize + 'px';
        highlightEl.style.height = cellSize + 'px';
        highlightActive = true;
      }
    } else {
      hideHighlight();
    }
  }

  function hideHighlight() {
    if (highlightActive) {
      highlightEl.style.display = 'none';
      highlightActive = false;
    }
  }

  function onUp(e) {
    if (!dragging) return;
    const piece = dragging;
    dragging = null;
    hideHighlight();
    piece.el.style.zIndex = '';
    piece.el.style.transition = 'transform ' + SCALE_DURATION + 'ms ease';

    if (!dragStarted) {
      returnToTray(piece);
      return;
    }

    const boardRect = board.getBoundingClientRect();
    const left = e.clientX - dragOffset.x * currentScale;
    const top = e.clientY - dragOffset.y * currentScale;
    const targetX = boardRect.left + piece.col * cellSize;
    const targetY = boardRect.top + piece.row * cellSize;

    const tol = cellSize * SNAP_TOLERANCE;
    const over = e.clientX >= boardRect.left && e.clientX <= boardRect.right &&
                 e.clientY >= boardRect.top && e.clientY <= boardRect.bottom;

    if (over && Math.abs(left - targetX) < tol && Math.abs(top - targetY) < tol) {
      placePiece(piece);
    } else {
      piece.el.classList.add('shake');
      setTimeout(() => {
        piece.el.classList.remove('shake');
        returnToTray(piece);
      }, 400);
    }
  }

  function returnToTray(piece) {
    const el = piece.el;
    el.style.transition = 'transform ' + SCALE_DURATION + 'ms ease';
    el.style.position = 'absolute';
    el.style.left = '0px';
    el.style.top = '0px';
    el.dataset.scale = TRAY_SCALE;
    el.style.transform = 'translate(' + el.dataset.trayX + 'px,' + el.dataset.trayY + 'px) scale(' + TRAY_SCALE + ')';
    el.style.zIndex = '';
  }

  function placePiece(piece) {
    const el = piece.el;
    el.dataset.placed = '1';
    piece.placed = true;
    placedCount++;
    el.classList.add('placed');

    const boardRect = board.getBoundingClientRect();
    const x = boardRect.left + piece.col * cellSize;
    const y = boardRect.top + piece.row * cellSize;

    el.style.position = 'fixed';
    el.style.left = '0px';
    el.style.top = '0px';
    el.style.transition = 'transform ' + SCALE_DURATION + 'ms ease';
    el.dataset.scale = BOARD_SCALE;
    el.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + BOARD_SCALE + ')';
    el.style.boxShadow = 'none';
    el.style.borderRadius = '0';

    drawBoard();

    if (placedCount === SIZE * SIZE) {
      finishGame();
    }
  }

  function finishGame() {
    shuffled = false;
    linesShown = false;
    drawBoard();
    setTimeout(() => {
      const vw = window.innerWidth, vh = window.innerHeight;
      let s = Math.min(vw * 0.9, vh * 0.65);
      winCanvas.width = s;
      winCanvas.height = s;
      winCanvas.style.width = s + 'px';
      winCanvas.style.height = s + 'px';
      const ctx = winCanvas.getContext('2d');
      ctx.drawImage(boardImg, 0, 0, s, s);
      winOverlay.classList.add('show');
    }, 350);
  }

  btnLines.addEventListener('click', () => {
    linesShown = true;
    drawBoard();
    btnLines.disabled = true;
    btnShuffle.disabled = false;
  });

  btnShuffle.addEventListener('click', () => {
    if (shuffled) return;
    shuffled = true;
    btnShuffle.disabled = true;
    drawBoard();
    const order = shuffleArray(pieces);
    pieces.forEach(p => { p.el.style.display = ''; });
    layoutTray(order);
  });

  btnRestart.addEventListener('click', () => {
    winOverlay.classList.remove('show');
    init();
  });

  function init() {
    linesShown = false;
    shuffled = false;
    placedCount = 0;
    dragging = null;
    dragStarted = false;
    overBoard = false;
    hideHighlight();
    tray.style.height = '0px';

    boardSize = calcBoardSize();
    cellSize = Math.floor(boardSize / SIZE);
    boardSize = cellSize * SIZE;

    boardWrap.style.width = boardSize + 'px';
    boardWrap.style.height = boardSize + 'px';

    boardImg = makeCatImage(boardSize * 2);
    drawBoard();

    btnLines.disabled = false;
    btnShuffle.disabled = true;

    createPieces();
    tray.style.width = '100%';
  }

  window.addEventListener('resize', () => {
    if (placedCount === 0 && !shuffled) init();
  });

  init();
})();
</script>
</body>
</html>
